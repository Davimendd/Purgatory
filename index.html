<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>LEMÚRIA | Acesso Monitorado</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- A LUZ NAO MENTE. ELA OMITE. -->

<style>
body {
  background: radial-gradient(circle at top, #111 0%, #050505 60%, #000 100%);
  color: #e2e2e2;
  font-family: "Courier New", monospace;
  margin: 0;
}

header {
  padding: 25px;
  border-bottom: 1px solid #2a2a2a;
  text-align: center;
}

h1 {
  letter-spacing: 6px;
  font-size: 22px;
}

main {
  padding: 30px;
  max-width: 900px;
  margin: auto;
}

.warning {
  border: 1px solid #7a0000;
  padding: 15px;
  background: rgba(122,0,0,0.12);
  margin-bottom: 30px;
  font-size: 13px;
}

.file {
  border: 1px solid #2a2a2a;
  padding: 15px;
  margin-bottom: 15px;
  cursor: pointer;
}

.file:hover {
  background: rgba(255,255,255,0.05);
}

footer {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin: 40px 0 20px;
  min-height: 40px;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.footer-ativo {
  opacity: 1;
  text-shadow: 0 0 8px rgba(180,0,0,0.6);
}

.footer-glitch {
  text-shadow: 2px 0 red, -2px 0 cyan;
}
</style>
</head>

<body>

<header>
  <h1>LEMÚRIA</h1>
  <p>REPOSITÓRIO RESTRITO — PROJETO PURGATÓRIO</p>
</header>

<main>
<div class="warning">
<strong>AVISO AO OPERADOR:</strong><br>
Este terminal não reconhece civis.<br>
<em>Nem toda violação é um erro.</em>
</div>

<div class="file" onclick="acessar('relatorio')">📄 OP-PRG-0001 — Relatório de Incidente</div>
<div class="file" onclick="acessar('marcas')">📄 OP-PRG-0002 — Marcas do Medo</div>
<div class="file" onclick="acessar('audio')">🔊 AUDIO_07_CORROMPIDO.wav</div>

<hr>

<div id="logs"></div>
</main>

<footer id="footer-text"></footer>

<script>
/* ===== CONFIGURAÇÃO DO JOGADOR ===== */
const jogadorMarcado = "Belo";

/* ===== JOGADORES E ENTIDADES ===== */
const marcados = {
  Belo: { entidade: "Azaroth", personagens: ["Olover Schäfer", "Klaus Mori"] },
  Maju: { entidade: "Luz", personagens: ["Arthur Hall", "Bertrand Durant"] },
  Kate: { entidade: "Azaroth", personagens: ["Roxanna Agriche"] },
  Lukas: { entidade: "Luz", personagens: ["Steven Walker"] },
  Clay: { entidade: "Azaroth", personagens: ["Emma Munroe"] },
  Lia: { entidade: "Luz", personagens: ["Sue Myeni"] },
  Caio: { entidade: "Azaroth", personagens: ["Eros Schäfer"] },
  Karen: { entidade: "Interferencia", personagens: ["Alice Miller"] }
};

/* ===== ACESSO AOS ARQUIVOS ===== */
function acessar(tipo) {
  const senha = prompt("Informe o nome da fundação responsável:");
  if (senha !== "H.4.R.D.1") {
    alert("Fundação não reconhecida.");
    return;
  }
  if (tipo === "relatorio") window.open("arquivos/OP-PRG-0001.pdf");
  if (tipo === "marcas") window.open("arquivos/OP-PRG-0002_MARCAS_DO_MEDO_CORROMPIDO.pdf");
  if (tipo === "audio") window.open("arquivos/AUDIO_07_CORROMPIDO.wav");
}

/* ===== LOGS DINÂMICOS POR DIA ===== */
const frasesLogs = {
  Azaroth: [
    "{nome} não deveria resistir.",
    "O caos observa {nome}.",
    "O sangue reconhece {nome}."
  ],
  Luz: [
    "{nome}, ainda há escolha.",
    "A luz espera por você, {nome}.",
    "{nome} não está sozinho."
  ],
  Interferencia: [
    "{nome} não pertence a nenhum lado.",
    "Eles mentem para {nome}.",
    "{nome} sente a falha."
  ]
};

function gerarLogs() {
  const area = document.getElementById("logs");
  const hoje = new Date().toDateString();
  let seed = hoje.length;

  const dados = marcados[jogadorMarcado];
  const entidade = dados.entidade;
  const frases = frasesLogs[entidade];

  let log = `<strong>LOGS DE ACESSO — ${hoje}</strong><br><br>`;
  for (let i = 0; i < 3; i++) {
    const frase = frases[(seed + i) % frases.length]
      .replace("{nome}", jogadorMarcado);
    log += `• ${frase}<br>`;
  }
  area.innerHTML = log;
}
gerarLogs();

/* ===== FOOTER VIVO ===== */
const footer = document.getElementById("footer-text");

const frasesFooter = {
  Azaroth: [
    "Você sente isso, {nome}.",
    "Não lute, {nome}.",
    "O caos já te conhece."
  ],
  Luz: [
    "{nome}, respire.",
    "Ainda há escolha.",
    "Não é tarde."
  ],
  Interferencia: [
    "{nome}… escolha logo.",
    "Eles mentem.",
    "Você sabe."
  ]
};

function atualizarFooter() {
  const entidade = marcados[jogadorMarcado]?.entidade || "Interferencia";
  let grupo = frasesFooter[entidade];

  if (Math.random() < 0.2) grupo = frasesFooter.Interferencia;

  const frase = grupo[Math.floor(Math.random() * grupo.length)]
    .replace("{nome}", jogadorMarcado);

  footer.textContent = frase;
  footer.classList.add("footer-ativo");

  if (Math.random() < 0.3) {
    footer.classList.add("footer-glitch");
    setTimeout(() => footer.classList.remove("footer-glitch"), 300);
  }
}

/* ===== DETECTA ATENÇÃO ===== */
let olhando = true;
let timeout;

document.addEventListener("visibilitychange", () => {
  olhando = !document.hidden;
  if (!olhando) footer.classList.remove("footer-ativo");
  else atualizarFooter();
});

document.addEventListener("mousemove", () => {
  olhando = true;
  atualizarFooter();
  clearTimeout(timeout);
  timeout = setTimeout(() => {
    olhando = false;
    footer.classList.remove("footer-ativo");
  }, 8000);
});

setTimeout(atualizarFooter, 2000);
setInterval(() => {
  if (olhando) atualizarFooter();
}, 180000);

/* ===== OBSERVAÇÃO ===== */
console.log("ALGUNS ACESSOS SÃO REGISTRADOS.");
console.log("LEMÚRIA OBSERVA.");
</script>

</body>
</html>

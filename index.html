<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>LEMÚRIA | Acesso Monitorado</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- A LUZ NAO MENTE. ELA OMITE. -->

<style>
body {
  background: radial-gradient(circle at top, #111 0%, #050505 60%, #000 100%);
  color: #e2e2e2;
  font-family: "Courier New", monospace;
  margin: 0;
}

.hidden { display: none; }

header {
  padding: 25px;
  border-bottom: 1px solid #2a2a2a;
  text-align: center;
}

main {
  padding: 30px;
  max-width: 900px;
  margin: auto;
}

input, button {
  background: #000;
  border: 1px solid #444;
  color: #e2e2e2;
  padding: 10px;
  font-family: inherit;
}

button { cursor: pointer; }

.file {
  border: 1px solid #2a2a2a;
  padding: 15px;
  margin-bottom: 15px;
  cursor: pointer;
}

.file:hover {
  background: rgba(255,255,255,0.05);
}

footer {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin: 40px 0 20px;
  min-height: 40px;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.footer-ativo {
  opacity: 1;
  text-shadow: 0 0 8px rgba(180,0,0,0.6);
}

.footer-glitch {
  text-shadow: 2px 0 red, -2px 0 cyan;
}

.log-cruzado {
  color: #7a0000;
}
</style>
</head>

<body>

<header>
  <h1>LEMÚRIA</h1>
  <p>REPOSITÓRIO RESTRITO — PROJETO PURGATÓRIO</p>
</header>

<!-- LOGIN -->
<main id="login">
  <p>IDENTIFICAÇÃO NECESSÁRIA</p>
  <input id="nomeJogador" placeholder="Nome do personagem">
  <button onclick="login()">ACESSAR</button>
</main>

<!-- SISTEMA -->
<main id="sistema" class="hidden">

  <div class="file" onclick="acessar('relatorio')">📄 OP-PRG-0001</div>
  <div class="file" onclick="acessar('marcas')">📄 OP-PRG-0002</div>
  <div class="file" onclick="acessar('audio')">🔊 AUDIO_07_CORROMPIDO</div>

  <hr>
  <div id="logs"></div>
</main>

<footer id="footer-text"></footer>

<script>
/* ===== JOGADORES MARCADOS ===== */
const marcados = {
  Belo: { entidade: "Azaroth" },
  Maju: { entidade: "Luz" },
  Kate: { entidade: "Azaroth" },
  Lukas: { entidade: "Luz" },
  Clay: { entidade: "Azaroth" },
  Lia: { entidade: "Luz" },
  Caio: { entidade: "Azaroth" },
  Karen: { entidade: "Interferencia" }
};

let jogador = localStorage.getItem("jogador");

/* ===== LOGIN ===== */
function login() {
  const nome = document.getElementById("nomeJogador").value.trim();
  if (!nome) return;
  jogador = nome;
  localStorage.setItem("jogador", nome);
  iniciarSistema();
}

function iniciarSistema() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("sistema").classList.remove("hidden");
  gerarLogs();
  atualizarFooter();
}

if (jogador) iniciarSistema();

/* ===== ACESSO A ARQUIVOS ===== */
function acessar(tipo) {
  const senha = prompt("Fundação responsável:");
  if (senha !== "H.4.R.D.1") {
    alert("Acesso negado.");
    return;
  }
  if (tipo === "relatorio") window.open("arquivos/OP-PRG-0001.pdf");
  if (tipo === "marcas") window.open("arquivos/OP-PRG-0002_MARCAS_DO_MEDO_CORROMPIDO.pdf");
  if (tipo === "audio") window.open("arquivos/AUDIO_07_CORROMPIDO.wav");
}

/* ===== LOGS BASE E CRUZADOS ===== */
const logsBase = {
  Azaroth: [
    "Azaroth observa {nome}.",
    "O caos responde a {nome}.",
    "{nome} sente o chamado do sangue."
  ],
  Luz: [
    "A Luz tenta alcançar {nome}.",
    "{nome} ainda pode escolher.",
    "{nome} resiste à escuridão."
  ],
  Interferencia: [
    "{nome} não pertence a nenhum lado.",
    "{nome} ouviu algo proibido.",
    "{nome} hesitou."
  ]
};

const logsCruzados = [
  "REGISTRO CRUZADO: {j1} foi mencionado após o acesso de {j2}.",
  "INTERFERÊNCIA DETECTADA ENTRE {j1} E {j2}.",
  "{j2} viu o mesmo símbolo que {j1}.",
  "O nome de {j1} surgiu durante o acesso de {j2}.",
  "{j1} tentou ignorar. {j2} não conseguiu."
];

function gerarLogs() {
  const area = document.getElementById("logs");
  const hoje = new Date().toDateString();

  const entidadeAtual = marcados[jogador]?.entidade || "Interferencia";
  const frasesAtual = logsBase[entidadeAtual];

  const outros = Object.keys(marcados).filter(n => n !== jogador);
  const outroJogador = outros[Math.floor(Math.random() * outros.length)];
  const entidadeOutro = marcados[outroJogador]?.entidade || "Interferencia";

  let html = `<strong>LOGS DE ACESSO — ${hoje}</strong><br><br>`;

  for (let i = 0; i < 2; i++) {
    html += "• " + frasesAtual[Math.floor(Math.random() * frasesAtual.length)]
      .replace("{nome}", jogador) + "<br>";
  }

  html += `<br><span class="log-cruzado">• ${
    logsCruzados[Math.floor(Math.random() * logsCruzados.length)]
      .replace("{j1}", jogador)
      .replace("{j2}", outroJogador)
  }</span><br>`;

  html += `<br>• ${entidadeOutro} foi detectada próxima a ${outroJogador}.<br>`;

  area.innerHTML = html;
}

/* ===== FOOTER VIVO ===== */
const footer = document.getElementById("footer-text");

const frasesFooter = {
  Azaroth: [
    "Você sente isso, {nome}.",
    "Não lute, {nome}.",
    "O caos já te conhece."
  ],
  Luz: [
    "{nome}, respire.",
    "Ainda há escolha.",
    "Não é tarde."
  ],
  Interferencia: [
    "{nome}… escolha logo.",
    "Eles mentem.",
    "Você sabe."
  ]
};

function atualizarFooter() {
  const entidade = marcados[jogador]?.entidade || "Interferencia";
  let grupo = frasesFooter[entidade];

  if (Math.random() < 0.2) grupo = frasesFooter.Interferencia;

  const frase = grupo[Math.floor(Math.random() * grupo.length)]
    .replace("{nome}", jogador);

  footer.textContent = frase;
  footer.classList.add("footer-ativo");

  if (Math.random() < 0.3) {
    footer.classList.add("footer-glitch");
    setTimeout(() => footer.classList.remove("footer-glitch"), 300);
  }
}

/* ===== ATENÇÃO DO JOGADOR ===== */
let olhando = true;
let timeout;

document.addEventListener("visibilitychange", () => {
  olhando = !document.hidden;
  if (!olhando) footer.classList.remove("footer-ativo");
  else atualizarFooter();
});

document.addEventListener("mousemove", () => {
  olhando = true;
  atualizarFooter();
  clearTimeout(timeout);
  timeout = setTimeout(() => {
    olhando = false;
    footer.classList.remove("footer-ativo");
  }, 8000);
});

setInterval(() => {
  if (olhando && jogador) atualizarFooter();
}, 180000);

console.log("ALGUNS ACESSOS SÃO REGISTRADOS.");
console.log("LEMÚRIA OBSERVA.");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LEMÚRIA — TERMINAL</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TERMINAL -->
<div id="terminal">

  <div id="main">

    <!-- LOGIN -->
    <div id="loginTela">
      <h1>LEMÚRIA</h1>
      <div class="sub">TERMINAL RESTRITO — PROJETO PURGATÓRIO</div>

      <p>IDENTIFICAÇÃO:</p>
      <input id="nome" autocomplete="off">
      <button onclick="login()">CONFIRMAR</button>

      <p id="erro" class="erro"></p>
    </div>

    <!-- SISTEMA -->
    <div id="sistema" class="hidden">
      <h1>LEMÚRIA</h1>
      <div class="sub">ACESSO CONCEDIDO</div>

      <div class="folder" onclick="toggle('docs')">📁 DOCUMENTOS</div>
      <div id="docs" class="files hidden">
        <div class="file doc" data-arq="OP-PRG-0001.pdf">📄 OP-PRG-0001</div>
        <div class="file doc" data-arq="OP-PRG-0002_MARCAS_DO_MEDO_CORROMPIDO.pdf">📄 OP-PRG-0002</div>
        <div class="file doc" data-arq="OP-DRK-INVESTIGATIVO_DRAKOVIA.pdf">📄 Investigativo Drakóvia</div>
        <div class="file doc" data-arq="OP-DRK-ANOTACOES_MANUSCRITAS_AGENTE.pdf">📄 Anotações Manuscritas</div>
        <div class="file bloqueado" onclick="acessarFundacao()">🔒 Fundação H.4.R.D.1</div>

      </div>

      <div class="folder" onclick="toggle('exp')">🧪 EXPERIMENTOS</div>
      <div id="exp" class="files hidden">
        <div class="file doc" data-arq="AUDIO_07_CORROMPIDO.wav">🔊 AUDIO_07_CORROMPIDO</div>
        <div class="file" onclick="clicarFitaVHS()">📼 Fita VHS</div>
      </div>

    </div>
  </div>

  <!-- LOGS -->
  <div id="logs"></div>

</div>

<!-- RITUAL (OVERLAY) -->
<div id="ritualTelopsia" class="hidden">
  <div id="simboloEnergia">🝪</div>
</div>


<audio id="musicaVHS" preload="auto">
  <source src="arquivos/take_a_slice.mp3" type="audio/mpeg">
</audio>


<script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>TERMINAL ARG — FUNDAÇÃO</title>

<style>
body {
  background:#050505;
  color:#cfcfcf;
  font-family: monospace;
  margin:0;
  padding:0;
}

#login, #terminal {
  padding:20px;
}

input, button {
  background:black;
  color:#cfcfcf;
  border:1px solid #333;
  padding:8px;
  margin-top:10px;
}

button:hover {
  background:#111;
  cursor:pointer;
}

.log {
  margin:6px 0;
  font-size:13px;
}

.log-entidade { color:#7a0000; }
.log-luz { color:#aaaaff; }
.log-cruzado { color:#888; font-style:italic; }

#footer {
  position:fixed;
  bottom:0;
  width:100%;
  background:#000;
  border-top:1px solid #222;
  padding:8px;
  text-align:center;
  opacity:0.1;
  transition:opacity 0.3s;
}

.footer-ativo { opacity:1; }
.footer-glitch { color:#7a0000; }

a {
  color:#7a0000;
  text-decoration:none;
}
a:hover { text-decoration:underline; }

.hidden { display:none; }
</style>
</head>
<body>

<div id="login">
  <h2>TERMINAL DA FUNDAÇÃO</h2>
  <p>IDENTIFICAÇÃO NECESSÁRIA</p>
  <p id="mensagem-retorno"></p>
  <input id="nomeJogador" placeholder="Nome do personagem">
  <br>
  <button onclick="login()">ACESSAR</button>
</div>

<div id="terminal" class="hidden">
  <h3>REGISTROS DE ACESSO</h3>
  <div id="logs"></div>

  <h3>ARQUIVOS</h3>
  <div id="arquivos"></div>
</div>

<div id="footer"></div>

<script>
/* ===== DADOS ===== */

const jogadores = {
  Clay: "Azaroth",
  Kate: "Azaroth",
  Belo: "Azaroth",
  Lukas: "Luz",
  Maju: "Luz",
  Lia: "Luz",
  Caio: "Azaroth"
};

const senhas = {
  Clay: ["DRK-OBSIDIA", "HIDRA-7"],
  Kate: ["TENEBRIA", "ECO-MEDO"],
  Belo: ["NEVOA-VIVA", "OLHO-QUE-LE"],
  Lukas: ["LUX-PRIME", "CRONO-MORTE"],
  Maju: ["SELO-LUZ", "PASSADO-FUTURO"],
  Lia: ["ORDEM", "HARMONIA"],
  Caio: ["AZAR-ETERNO", "VOZES-DO-MAR"]
};

const frasesEntidades = {
  Azaroth: [
    "Eu vi você sair.",
    "A Luz mente.",
    "Drakóvia observa.",
    "O medo ensina."
  ],
  Luz: [
    "Não confie no caos.",
    "Azaroth corrompe.",
    "O tempo é morte.",
    "Ainda há escolha."
  ]
};

const frasesAmeaca = [
  "Você fala com o lado errado.",
  "Eles já tocaram seu medo.",
  "O outro lado mente para você."
];

let jogador = sessionStorage.getItem("jogador");
const jaEntrouAntes = localStorage.getItem("jaEntrouAntes");

/* ===== LOGIN ===== */

function login() {
  const nome = document.getElementById("nomeJogador").value.trim();
  if (!jogadores[nome]) {
    alert("IDENTIDADE NÃO RECONHECIDA");
    return;
  }
  jogador = nome;
  sessionStorage.setItem("jogador", nome);
  localStorage.setItem("jaEntrouAntes", "true");
  iniciar();
}

/* ===== INICIAR ===== */

function iniciar() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("terminal").classList.remove("hidden");
  gerarLogs();
  gerarArquivos();
  atualizarFooter();
}

/* ===== LOGS ===== */

function gerarLogs() {
  const logs = document.getElementById("logs");
  logs.innerHTML = "";

  const entidade = jogadores[jogador];
  const data = new Date().toLocaleDateString();

  logs.innerHTML += `<div class="log">[${data}] Acesso confirmado: ${jogador}</div>`;

  if (jaEntrouAntes) {
    logs.innerHTML += `<div class="log log-cruzado">
      ${jogador} retornou após abandonar o terminal.
    </div>`;
  }

  logs.innerHTML += `<div class="log log-entidade">
    ${entidade}: ${frasesEntidades[entidade][Math.floor(Math.random()*4)]}
  </div>`;

  if (Math.random() < 0.4) {
    logs.innerHTML += `<div class="log log-entidade">
      ${frasesAmeaca[Math.floor(Math.random()*3)]}
    </div>`;
  }

  logs.innerHTML += `<div class="log log-cruzado">
    Fragmento observado em outro marcado.
  </div>`;
}

/* ===== ARQUIVOS ===== */

function gerarArquivos() {
  const div = document.getElementById("arquivos");
  div.innerHTML = `
  <p>Arquivo OP-DRK-0001 — Drakóvia<br>
  <input placeholder="Senha" oninput="verificarSenha(this, 0)">
  </p>

  <p>Arquivo OP-DRK-ANOTAÇÕES<br>
  <input placeholder="Senha" oninput="verificarSenha(this, 1)">
  </p>
  `;
}

function verificarSenha(input, index) {
  if (input.value === senhas[jogador][index]) {
    input.outerHTML = `
      <a href="${index===0 ? 'OP-DRK-INVESTIGATIVO_DRAKOVIA.pdf' :
      'OP-DRK-ANOTACOES_MANUSCRITAS_AGENTE.pdf'}" target="_blank">
      ACESSAR ARQUIVO
      </a>`;
  }
}

/* ===== FOOTER ===== */

const footer = document.getElementById("footer");

document.addEventListener("mousemove", () => {
  footer.classList.add("footer-ativo");
  atualizarFooter();
  setTimeout(()=>footer.classList.remove("footer-ativo"),800);
});

function atualizarFooter() {
  const entidade = jogadores[jogador];
  footer.textContent = `${entidade} chama por ${jogador}…`;

  if (Math.random() < 0.3) {
    footer.classList.add("footer-glitch");
    setTimeout(()=>footer.classList.remove("footer-glitch"),300);
  }
}

/* ===== LIMPAR SESSÃO ===== */

window.addEventListener("beforeunload", () => {
  sessionStorage.clear();
});

/* ===== AUTO ===== */

if (jaEntrouAntes) {
  document.getElementById("mensagem-retorno").innerText =
    "O TERMINAL RECONHECE SUA AUSÊNCIA.";
}
</script>
</body>
</html>

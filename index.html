<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>LEMÚRIA | Terminal Vivo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- A LUZ NAO MENTE. ELA OMITE. -->

<style>
body {
  background: radial-gradient(circle at top, #111 0%, #050505 60%, #000 100%);
  color: #e2e2e2;
  font-family: "Courier New", monospace;
  margin: 0;
}

.hidden { display: none; }

header {
  padding: 25px;
  border-bottom: 1px solid #2a2a2a;
  text-align: center;
}

main {
  padding: 30px;
  max-width: 900px;
  margin: auto;
}

input, button {
  background: #000;
  border: 1px solid #444;
  color: #e2e2e2;
  padding: 10px;
  font-family: inherit;
}

button { cursor: pointer; }

.file {
  border: 1px solid #2a2a2a;
  padding: 15px;
  margin-bottom: 15px;
  cursor: pointer;
}

.file:hover {
  background: rgba(255,255,255,0.05);
}

footer {
  text-align: center;
  font-size: 12px;
  color: #7a0000;
  margin: 40px 0 20px;
  min-height: 40px;
  opacity: 0;
  transition: opacity 1.5s ease;
}

.footer-ativo {
  opacity: 1;
  text-shadow: 0 0 8px rgba(180,0,0,0.6);
}

.footer-glitch {
  text-shadow: 2px 0 red, -2px 0 cyan;
}

.log-cruzado {
  color: #7a0000;
}
</style>
</head>

<body>

<header>
  <h1>LEMÚRIA</h1>
  <p>REPOSITÓRIO RESTRITO — PROJETO PURGATÓRIO</p>
</header>

<!-- LOGIN -->
<main id="login">
  <p>IDENTIFICAÇÃO NECESSÁRIA</p>
  <input id="nomeJogador" placeholder="Nome do personagem">
  <button onclick="login()">ACESSAR</button>
</main>

<!-- SISTEMA -->
<main id="sistema" class="hidden">

  <div class="file" onclick="acessarFundacao('relatorio')">📄 OP-PRG-0001</div>
  <div class="file" onclick="acessarFundacao('marcas')">📄 OP-PRG-0002</div>
  <div class="file" onclick="acessarFundacao('audio')">🔊 AUDIO_07_CORROMPIDO</div>

  <hr>

  <div class="file" onclick="acessarDrakovia()">📄 OP-DRK-███ — Drakóvia</div>
  <div class="file" onclick="acessarAnotacoes()">✎ Anotações Manuscritas</div>

  <hr>
  <div id="logs"></div>
</main>

<footer id="footer-text"></footer>

<script>
/* ===== JOGADORES ===== */
const jogadores = {
  Belo: "Azaroth",
  Kate: "Azaroth",
  Clay: "Azaroth",
  Caio: "Azaroth",
  Maju: "Luz",
  Lukas: "Luz",
  Lia: "Luz",
  Karen: "Interferencia"
};

const senhaDrakovia = "TENEBRIA-ESPERA";
const senhaAnotacoes = "A-RELIQUIA-RESPIRA";

let jogador = localStorage.getItem("jogador");

/* ===== LOGIN ===== */
function login() {
  const nome = document.getElementById("nomeJogador").value.trim();
  if (!jogadores[nome]) {
    alert("IDENTIDADE NÃO RECONHECIDA.");
    return;
  }
  jogador = nome;
  localStorage.setItem("jogador", nome);
  iniciar();
}

function iniciar() {
  document.getElementById("login").classList.add("hidden");
  document.getElementById("sistema").classList.remove("hidden");
  gerarLogs();
  atualizarFooter();
}

if (jogador) iniciar();

/* ===== ACESSO FUNDAÇÃO ===== */
function acessarFundacao(tipo) {
  const senha = prompt("Fundação responsável:");
  if (senha !== "H.4.R.D.1") {
    alert("ACESSO NEGADO.");
    return;
  }

  if (tipo === "relatorio") window.open("arquivos/OP-PRG-0001.pdf");
  if (tipo === "marcas") window.open("arquivos/OP-PRG-0002_MARCAS_DO_MEDO_CORROMPIDO.pdf");
  if (tipo === "audio") window.open("arquivos/AUDIO_07_CORROMPIDO.wav");
}

/* ===== DRK PDFs ===== */
function acessarDrakovia() {
  const s = prompt("Senha do Arquivo:");
  if (s === senhaDrakovia)
    window.open("arquivos/OP-DRK-INVESTIGATIVO_DRAKOVIA.pdf");
  else alert("A TENEBRIA OBSERVA.");
}

function acessarAnotacoes() {
  const s = prompt("Senha do Arquivo:");
  if (s === senhaAnotacoes)
    window.open("arquivos/OP-DRK-ANOTACOES_MANUSCRITAS_AGENTE.pdf");
  else alert("VOCÊ NÃO ESTÁ PRONTO.");
}

/* ===== LOGS ===== */
const fragmentos = {
  Azaroth: [
    "TENEBRIA",
    "ESPERA",
    "O CAOS TE CONHECE"
  ],
  Luz: [
    "A",
    "RELIQUIA",
    "RESPIRA"
  ]
};

const logsCruzados = [
  "REGISTRO CRUZADO: {j1} apareceu após o acesso de {j2}.",
  "{j2} viu o mesmo símbolo que {j1}.",
  "INTERFERÊNCIA ENTRE {j1} E {j2}."
];

function gerarLogs() {
  const area = document.getElementById("logs");
  const hoje = new Date().toDateString();
  const entidade = jogadores[jogador];

  const outros = Object.keys(jogadores).filter(n => n !== jogador);
  const outro = outros[Math.floor(Math.random() * outros.length)];

  let html = `<strong>LOGS — ${hoje}</strong><br><br>`;

  fragmentos[entidade]?.forEach(f => {
    if (Math.random() < 0.5)
      html += `• ${jogador}, ${f}.<br>`;
  });

  html += `<br><span class="log-cruzado">• ${
    logsCruzados[Math.floor(Math.random()*logsCruzados.length)]
      .replace("{j1}", jogador)
      .replace("{j2}", outro)
  }</span>`;

  area.innerHTML = html;
}

/* ===== FOOTER VIVO ===== */
const footer = document.getElementById("footer-text");

function atualizarFooter() {
  footer.textContent = `${jogadores[jogador]} sussurra: ${jogador}…`;
  footer.classList.add("footer-ativo");

  if (Math.random() < 0.3) {
    footer.classList.add("footer-glitch");
    setTimeout(()=>footer.classList.remove("footer-glitch"),300);
  }
}

document.addEventListener("mousemove", atualizarFooter);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) footer.classList.remove("footer-ativo");
  else atualizarFooter();
});

setInterval(()=>{ if(!document.hidden) atualizarFooter(); },180000);

console.log("ALGUNS ACESSOS SÃO REGISTRADOS.");
console.log("O PORTÃO OBSERVA.");
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>TERMINAL DA FUNDAÇÃO</title>

<style>
/* ===== RESET ===== */
* {
  box-sizing: border-box;
}

/* ===== FUNDO CRT ===== */
body {
  background: radial-gradient(ellipse at center, #0a120a 0%, #020402 70%);
  color: #7CFF7C;
  font-family: "Courier New", monospace;
  margin: 0;
  height: 100vh;
  overflow: hidden;
}

/* ===== SCANLINES ===== */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0.15) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
}

/* ===== VINHETA ===== */
body::after {
  content:"";
  position:fixed;
  inset:0;
  box-shadow: inset 0 0 120px rgba(0,0,0,0.9);
  pointer-events:none;
}

/* ===== TERMINAL ===== */
#terminal, #login {
  padding: 25px;
  height: 100%;
  overflow-y: auto;
  text-shadow: 0 0 6px rgba(124,255,124,0.4);
}

/* ===== INPUT ===== */
input, button {
  background: black;
  border: 1px solid #3aff3a;
  color: #7CFF7C;
  padding: 6px;
  font-family: inherit;
  margin-top: 6px;
}

button:hover {
  background: #041a04;
  cursor: pointer;
}

/* ===== LOGS ===== */
.log {
  margin: 4px 0;
  font-size: 13px;
}

.log-entidade {
  color: #ff6a6a;
  text-shadow: 0 0 6px rgba(255,0,0,0.5);
}

.log-luz {
  color: #7cb7ff;
}

.log-cruzado {
  color: #b6ffb6;
  font-style: italic;
}

/* ===== LINKS ===== */
a {
  color: #ff6a6a;
  text-decoration: none;
}
a:hover {
  text-decoration: underline;
}

/* ===== FOOTER ===== */
#footer {
  position: fixed;
  bottom: 0;
  width: 100%;
  padding: 6px;
  background: rgba(0,0,0,0.8);
  border-top: 1px solid #144214;
  text-align: center;
  font-size: 12px;
  opacity: 0;
  transition: opacity 0.4s;
}

.footer-ativo { opacity: 1; }
.footer-glitch {
  animation: glitch 0.15s infinite alternate;
}

@keyframes glitch {
  from { text-shadow: 2px 0 red; }
  to { text-shadow: -2px 0 cyan; }
}

/* ===== CURSOR PISCANDO ===== */
.cursor::after {
  content: "█";
  animation: blink 1s infinite;
}

@keyframes blink {
  0%, 50% { opacity: 1; }
  51%, 100% { opacity: 0; }
}

.hidden { display:none; }
</style>
</head>

<body>

<div id="login">
  <pre>
FUNDAÇÃO — TERMINAL RESTRITO
SISTEMA: PURGATÓRIO
STATUS: MONITORANDO
  </pre>
  <p class="cursor">IDENTIFICAÇÃO</p>
  <input id="nomeJogador" placeholder="Digite seu nome">
  <br>
  <button onclick="login()">CONFIRMAR</button>
  <p id="mensagem-retorno"></p>
</div>

<div id="terminal" class="hidden">
  <pre>
== REGISTROS DE ACESSO ==
  </pre>
  <div id="logs"></div>

  <pre>
== ARQUIVOS BLOQUEADOS ==
  </pre>
  <div id="arquivos"></div>
</div>

<div id="footer"></div>

<script>
/* ===== DADOS ===== */
const jogadores = {
  Clay:"Azaroth", Kate:"Azaroth", Belo:"Azaroth",
  Lukas:"Luz", Maju:"Luz", Lia:"Luz", Caio:"Azaroth"
};

const senhas = {
  Clay:["DRK-OBSIDIA","HIDRA-7"],
  Kate:["TENEBRIA","ECO-MEDO"],
  Belo:["NEVOA-VIVA","OLHO-QUE-LE"],
  Lukas:["LUX-PRIME","CRONO-MORTE"],
  Maju:["SELO-LUZ","PASSADO-FUTURO"],
  Lia:["ORDEM","HARMONIA"],
  Caio:["AZAR-ETERNO","VOZES-DO-MAR"]
};

const frases = {
  Azaroth:[
    "O medo ensina.",
    "Você voltou.",
    "Drakóvia observa."
  ],
  Luz:[
    "Ainda há escolha.",
    "Não confie no caos.",
    "O tempo cobra."
  ]
};

let jogador = sessionStorage.getItem("jogador");
const jaEntrouAntes = localStorage.getItem("jaEntrouAntes");

/* ===== LOGIN ===== */
function login() {
  const nome = nomeJogador.value.trim();
  if (!jogadores[nome]) return alert("ACESSO NEGADO");
  jogador = nome;
  sessionStorage.setItem("jogador", nome);
  localStorage.setItem("jaEntrouAntes","1");
  iniciar();
}

/* ===== INICIAR ===== */
function iniciar() {
  loginDiv.hidden = true;
  terminal.hidden = false;
  gerarLogs();
  gerarArquivos();
  atualizarFooter();
}

/* ===== LOGS ===== */
function gerarLogs() {
  logs.innerHTML = "";
  const entidade = jogadores[jogador];

  logs.innerHTML += `<div class="log">Acesso confirmado: ${jogador}</div>`;
  if (jaEntrouAntes)
    logs.innerHTML += `<div class="log log-cruzado">Sessão anterior interrompida.</div>`;

  logs.innerHTML += `<div class="log log-entidade">${entidade}: ${frases[entidade][Math.floor(Math.random()*3)]}</div>`;
}

/* ===== ARQUIVOS ===== */
function gerarArquivos() {
  arquivos.innerHTML = `
  OP-DRK-0001<br>
  <input placeholder="Senha" oninput="verificar(this,0)"><br><br>
  OP-DRK-ANOTAÇÕES<br>
  <input placeholder="Senha" oninput="verificar(this,1)">
  `;
}

function verificar(el,i) {
  if (el.value === senhas[jogador][i]) {
    el.outerHTML = `<a href="${i===0?'OP-DRK-INVESTIGATIVO_DRAKOVIA.pdf':'OP-DRK-ANOTACOES_MANUSCRITAS_AGENTE.pdf'}" target="_blank">ACESSAR</a>`;
  }
}

/* ===== FOOTER ===== */
function atualizarFooter() {
  footer.textContent = `${jogadores[jogador]} chama por ${jogador}`;
  footer.classList.add("footer-ativo");
  if (Math.random()<0.3) footer.classList.add("footer-glitch");
  setTimeout(()=>footer.classList.remove("footer-glitch"),300);
}

/* ===== LIMPAR SESSÃO ===== */
window.addEventListener("beforeunload",()=>sessionStorage.clear());

if (jaEntrouAntes)
  mensagem-retorno.textContent = "O TERMINAL REGISTROU SUA AUSÊNCIA.";
</script>
</body>
</html>
